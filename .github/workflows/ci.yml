name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code formatting check
        run: pnpm format:check

      - name: Type check all packages
        run: pnpm typecheck

      - name: Lint all packages
        run: pnpm lint

      - name: Run unit & contract tests
        run: pnpm test

      - name: Verify architectural boundaries & circularity
        run: pnpm test:boundaries

      - name: Verify open-core license compliance
        run: pnpm test:licenses

      - name: Build all packages
        run: pnpm build

  fresh-clone:
    name: Fresh-Clone Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh copy
        uses: actions/checkout@v4
        with:
          path: fresh-clone

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install & verify in cold environment
        working-directory: fresh-clone
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
